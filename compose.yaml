name: styrkeanalyse-fdm

services:
  analysis:
    build:
      context: .
      dockerfile: docker/analysis.Dockerfile
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    image: styrkeanalyse-fdm:analysis
    init: true
    working_dir: /workspaces/styrkeanalyse-fdm
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspaces/styrkeanalyse-fdm:cached
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}
    ports: ["127.0.0.1:8888:8888"]
    stdin_open: true
    tty: true
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.token=${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}"]

  fenicsx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DOLFINX_IMAGE: ${DOLFINX_IMAGE:-ghcr.io/fenics/dolfinx/dolfinx:stable}
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    image: styrkeanalyse-fdm:fenicsx
    init: true
    working_dir: /workspaces/styrkeanalyse-fdm
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspaces/styrkeanalyse-fdm:cached
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      PYVISTA_OFF_SCREEN: "true"
    ports: ["127.0.0.1:8889:8888"]
    stdin_open: true
    tty: true
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.token=${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}"]

  rve:
    build:
      context: .
      dockerfile: docker/rve.Dockerfile
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    image: styrkeanalyse-fdm:rve
    init: true
    working_dir: /workspaces/styrkeanalyse-fdm
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspaces/styrkeanalyse-fdm:cached
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}
    ports: ["127.0.0.1:8890:8888"]
    stdin_open: true
    tty: true
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.token=${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}"]

  gui:
    build:
      context: .
      dockerfile: docker/gui.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    image: styrkeanalyse-fdm:gui
    init: true
    restart: unless-stopped
    depends_on:
      runner:
        condition: service_healthy
    environment:
      FDM_GUI_HOST: 0.0.0.0
      FDM_GUI_PORT: "8000"
      FDM_GUI_STATIC_DIR: /app/frontend/dist
      FDM_GUI_DATA_DIR: /data
      FDM_RUNNER_URL: http://runner:8020
    ports: ["127.0.0.1:8010:8000"]
    volumes:
      - gui_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    image: styrkeanalyse-fdm:runner
    init: true
    restart: unless-stopped
    user: "0:0"
    environment:
      FDM_RUNNER_HOST: 0.0.0.0
      FDM_RUNNER_PORT: "8020"
      FDM_RUNNER_DATA_DIR: /data
    volumes:
      - gui_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  exp-reduction:
    profiles: ["stage-build"]
    build:
      context: .
      dockerfile: docker/exp-reduction.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    image: styrkeanalyse-fdm:exp-reduction

volumes:
  gui_data:
