name: styrkeanalyse-fdm

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Pin this to a release tag once the environment has been accepted for
        # a report dataset. `stable` is convenient while the project is young.
        DOLFINX_IMAGE: ${DOLFINX_IMAGE:-ghcr.io/fenics/dolfinx/dolfinx:stable}
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    image: styrkeanalyse-fdm:dev
    init: true
    working_dir: /workspaces/styrkeanalyse-fdm
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspaces/styrkeanalyse-fdm:cached
    environment:
      # Open MPI is intentionally allowed to use all allocated CPU cores.
      # Override this in .env for an explicit experiment limit.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      PYVISTA_OFF_SCREEN: "true"
    stdin_open: true
    tty: true
    command: sleep infinity
