name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Test Python package
        run: uv run --frozen pytest -q
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Test frontend
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Build pinned experimental-reduction image
        run: |
          FDM_DEPENDENCY_LOCK_SHA256="$(sha256sum uv.lock | cut -d ' ' -f 1)"
          docker build --build-arg FDM_DEPENDENCY_LOCK_SHA256="${FDM_DEPENDENCY_LOCK_SHA256}" --build-arg GIT_COMMIT="${GITHUB_SHA}" --build-arg GIT_DIRTY=false -f docker/exp-reduction.Dockerfile -t styrkeanalyse-fdm:exp-reduction .
      - name: Build pinned isotropic FEM image
        run: |
          FDM_DEPENDENCY_LOCK_SHA256="$(sha256sum uv.lock | cut -d ' ' -f 1)"
          docker build --build-arg FDM_DEPENDENCY_LOCK_SHA256="${FDM_DEPENDENCY_LOCK_SHA256}" --build-arg GIT_COMMIT="${GITHUB_SHA}" --build-arg GIT_DIRTY=false -f docker/isotropic-fem.Dockerfile -t styrkeanalyse-fdm:isotropic-fem .
      - name: Build pinned CalculiX verification image
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" --build-arg GIT_DIRTY=false -f docker/isotropic-calculix.Dockerfile -t styrkeanalyse-fdm:isotropic-calculix .
      - name: Run four-gate isotropic FEM verification
        run: |
          mkdir -p artifacts/m4-isotropic
          uv run --frozen python scripts/verify_isotropic_fem.py \
            --dolfinx-image styrkeanalyse-fdm:isotropic-fem \
            --calculix-image styrkeanalyse-fdm:isotropic-calculix \
            --git-commit "${GITHUB_SHA}" \
            --output-dir artifacts/m4-isotropic
      - name: Retain M4 solver evidence and assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-isotropic-verification-${{ github.sha }}
          path: artifacts/m4-isotropic/
          if-no-files-found: warn
      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run browser, mobile, and accessibility checks
        run: npm run test:e2e --prefix frontend
      - name: Build runner image
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" --build-arg GIT_DIRTY=false -f docker/runner.Dockerfile -t styrkeanalyse-fdm:runner-ci .
      - name: Build desktop GUI image
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" --build-arg GIT_DIRTY=false -f docker/gui.Dockerfile -t styrkeanalyse-fdm:gui-ci .
      - name: Start GUI and runner images and exercise the isolated stage
        run: |
          set -euo pipefail
          network=fdm-smoke-network
          volume=fdm-smoke-data
          runner=fdm-runner-smoke
          gui=fdm-gui-smoke
          trap 'docker rm -f "$gui" "$runner" >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker network create "$network" >/dev/null
          docker volume create "$volume" >/dev/null
          docker run -d --name "$runner" --network "$network" --network-alias runner --user 0:0 \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$volume:/data" \
            -e FDM_RUNNER_HOST=0.0.0.0 -e FDM_RUNNER_DATA_DIR=/data styrkeanalyse-fdm:runner-ci
          for attempt in {1..20}; do
            runner_health=$(docker inspect --format '{{.State.Health.Status}}' "$runner")
            if [[ "$runner_health" == "healthy" ]]; then break; fi
            sleep 2
          done
          runner_health=$(docker inspect --format '{{.State.Health.Status}}' "$runner")
          if [[ "$runner_health" != "healthy" ]]; then docker logs "$runner"; exit 1; fi
          docker run -d --name "$gui" --network "$network" -p 127.0.0.1:18010:8000 \
            -v "$volume:/data" -e FDM_RUNNER_URL=http://runner:8020 styrkeanalyse-fdm:gui-ci
          for attempt in {1..20}; do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$gui")
            if [[ "$health" == "healthy" ]]; then
              curl --fail --silent http://127.0.0.1:18010/api/health
              break
            fi
            sleep 2
          done
          health=$(docker inspect --format '{{.State.Health.Status}}' "$gui")
          if [[ "$health" != "healthy" ]]; then docker logs "$gui"; exit 1; fi
          python - <<'PY'
          import base64
          import hashlib
          import json
          import time
          from urllib.request import Request, urlopen

          source = b"force_N,displacement_mm\n0,0\n12,0.0125\n24,0.025\n"
          payload = {
              "operation": "tensile",
              "input_file": {
                  "filename": "smoke.csv",
                  "media_type": "text/csv",
                  "sha256": hashlib.sha256(source).hexdigest(),
                  "content_base64": base64.b64encode(source).decode("ascii"),
              },
              "parameters": {
                  "force_column": "force_N", "displacement_column": "displacement_mm",
                  "width_mm": 12, "thickness_mm": 1, "gauge_length_mm": 25,
                  "force_unit": "N", "displacement_unit": "mm",
                  "decimal_separator": ".", "tension_direction": "positive",
                  "specimen_id": "ci-smoke", "sensor_source": "extensometer",
                  "compliance_correction": {"method": "not_required"},
              },
          }
          def call(url, data=None):
              request = Request(url, data=data, headers={"Content-Type": "application/json"} if data else {})
              with urlopen(request, timeout=180) as response:
                  return json.load(response)

          def wait_job(job_id):
              deadline = time.monotonic() + 180
              while time.monotonic() < deadline:
                  current = call(f"http://127.0.0.1:18010/api/jobs/{job_id}")
                  if current["job"]["status"] == "succeeded":
                      return current
                  if current["job"]["status"] == "failed":
                      raise AssertionError(current)
                  time.sleep(0.1)
              raise AssertionError(f"job {job_id} timed out")

          queued = call(
              "http://127.0.0.1:18010/api/runs",
              json.dumps(payload).encode(),
          )
          run_response = wait_job(queued["job"]["id"])
          assert run_response["run"]["status"] == "succeeded", run_response
          assert len(run_response["run"]["stages"][0]["output_artifacts"]) == 2
          run_id = run_response["run"]["id"]
          replay_queued = call(f"http://127.0.0.1:18010/api/runs/{run_id}/replay", b"{}")
          replay = wait_job(replay_queued["job"]["id"])
          assert replay["run"]["status"] == "succeeded", replay
          assert replay["result"] == run_response["result"]

          fem_request = {
              "boundary_conditions": {
                  "axial_axis": "x", "fixed_axial_face": "x_min",
                  "prescribed_axial_face": "x_max", "set_id": "axial-pull-v1",
                  "transverse_rigid_mode_control": "3d_minimal_rigid_mode_pins",
                  "unloaded_faces": "traction_free",
              },
              "load": {"force_n": 100.0},
              "material": {
                  "poissons_ratio": 0.35, "profile_id": "PLA-isotropic-v1",
                  "youngs_modulus_mpa": 2000.0,
              },
              "mesh": {"element_order": 2, "max_cell_size_mm": 2.5, "optimize": True},
              "schema_version": 1,
              "specimen": {
                  "length_mm": 50.0, "specimen_id": "SYN-T01",
                  "thickness_mm": 2.0, "width_mm": 10.0,
              },
          }
          fem_source = (json.dumps(fem_request, sort_keys=True, separators=(",", ":")) + "\n").encode()
          fem_payload = {
              "operation": "fdm-l2-isotropic",
              "input_file": {
                  "filename": "request.json",
                  "media_type": "application/vnd.styrkeanalyse.fem-request+json",
                  "sha256": hashlib.sha256(fem_source).hexdigest(),
                  "content_base64": base64.b64encode(fem_source).decode("ascii"),
              },
              "parameters": {},
              "upstream_run_ids": [],
          }
          fem_queued = call("http://127.0.0.1:18010/api/runs", json.dumps(fem_payload).encode())
          fem_run = wait_job(fem_queued["job"]["id"])
          assert fem_run["run"]["status"] == "succeeded", fem_run
          assert fem_run["run"]["schema_version"] == 2
          assert {item["media_type"] for item in fem_run["run"]["stages"][0]["output_artifacts"]} == {
              "application/vnd.styrkeanalyse.fem-result+json",
              "application/vnd.gmsh.msh",
              "application/vnd.xdmf+xml",
              "application/x-hdf5",
              "application/vnd.styrkeanalyse.stage-provenance+json",
          }
          fem_replay_queue = call(
              f"http://127.0.0.1:18010/api/runs/{fem_run['run']['id']}/replay", b"{}"
          )
          fem_replay = wait_job(fem_replay_queue["job"]["id"])
          assert fem_replay["run"]["status"] == "succeeded", fem_replay
          assert fem_replay["result"] == fem_run["result"]
          print("GUI-to-runner reduction and real isotropic FEM executions with immutable replays succeeded")
          PY
